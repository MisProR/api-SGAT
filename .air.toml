root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/sgat-api.exe ./cmd/api"
  entrypoint = ["./tmp/sgat-api.exe"]
  delay = 1000
  exclude_dir = ["tmp", "bin", "vendor"]
  include_ext = ["go", "env"]
  exclude_regex = ["_test.go"]
  kill_delay = "500ms"
  send_interrupt = false
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
